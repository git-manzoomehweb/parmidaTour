<basis core="dbsource" source="basiscore" lid="1" mid="20" name="destination"
  ><member
    name="category"
    type="tree"
    request="cat"
    parentid="[##cms.query.catid##]"
    order="ord"
/></basis>
<basis core="list" datamembername="destination.category">
  <else-layout>
    <p class="text-primary-900">موردی یافت نشد ❗</p>
  </else-layout>
  <layout> @child </layout>
  <face filter="link is null and RowNumber<>1">
    <div
      class="swiper-slide w-238 rounded-xl group overflow-hidden relative !h-[269px]"
    >
      <a href="/tour-list.bc?catid=@catid" class="w-full h-full flex flex-col">
        <img
          loading="lazy"
          width="246"
          height="354"
          src="@image"
          alt="@title"
          class="w-full h-full absolute top-0 left-0 object-cover z-0"
        />

        <div
          class="absolute z-[1] py-6 justify-between items-center flex flex-col w-full h-full linear-2 top-0 left-0"
        >
          <p class="text-xl font-bold text-zinc-900 text-center">@title</p>
          <div
            class="flex relative group-hover:w-12 transition-all ease-in-out duration-500 border-2 border-primary-900 group-hover:bg-[#24366D] overflow-hidden w-[128px] text-white justify-center items-center h-12 rounded-3xl bg-primary-900"
          >
            <span
              class="transition-all group-hover:-translate-x-48 ease-in-out duration-500"
              >بزن بریم</span
            >
            <span
              class="translate-x-28 absolute group-hover:translate-x-0 ease-in-out duration-500 transition-all"
            >
              <svg
                width="24"
                height="25"
                viewBox="0 0 24 25"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M4.25 12.7743L19.25 12.7743"
                  stroke="#fff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M10.3008 18.7987L4.25078 12.7747L10.3008 6.74969"
                  stroke="#fff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </span>
          </div>
        </div>
      </a>
    </div>
  </face>
  <face filter="RowNumber<>1">
    <div
      class="swiper-slide w-246 rounded-xl group overflow-hidden relative !h-[269px]"
    >
      <a href="@link" class="w-full h-full flex flex-col">
        <img
          loading="lazy"
          width="246"
          height="354"
          src="@image"
          alt="@title"
          class="w-full h-full absolute top-0 left-0 object-cover z-0"
        />

        <div
          class="absolute z-[1] py-6 justify-between items-center flex flex-col w-full h-full linear-2 top-0 left-0"
        >
          <p class="text-xl font-bold text-zinc-900 text-center">@title</p>
          <div
            class="flex relative group-hover:w-12 transition-all ease-in-out duration-500 border-2 border-primary-900 group-hover:bg-[#24366D] overflow-hidden w-[128px] text-white justify-center items-center h-12 rounded-3xl bg-primary-900"
          >
            <span
              class="transition-all group-hover:-translate-x-48 ease-in-out duration-500"
              >بزن بریم</span
            >
            <span
              class="translate-x-28 absolute group-hover:translate-x-0 ease-in-out duration-500 transition-all"
            >
              <svg
                width="24"
                height="25"
                viewBox="0 0 24 25"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M4.25 12.7743L19.25 12.7743"
                  stroke="#fff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M10.3008 18.7987L4.25078 12.7747L10.3008 6.74969"
                  stroke="#fff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </span>
          </div>
        </div>
      </a>
    </div>
  </face>
</basis>
